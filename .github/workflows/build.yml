name: Build IPA (sin firmar)

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  pull_request:
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Imagen y Xcode fijos: «latest» puede cambiar y romper el build sin tocar código.
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Seleccionar Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'

      - name: Metal Toolchain (Xcode 26 lo instala aparte; KSPlayer compila shaders)
        run: xcodebuild -downloadComponent MetalToolchain || echo "No requerido en esta versión de Xcode"

      - name: Instalar XcodeGen y xcbeautify
        run: brew install xcodegen xcbeautify

      - name: Generar proyecto Xcode
        run: xcodegen generate

      - name: Caché de paquetes Swift (FFmpegKit pesa >1 GB)
        uses: actions/cache@v4
        with:
          path: build/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('project.yml') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Resolver dependencias
        run: |
          xcodebuild -resolvePackageDependencies \
            -project MurmurPlayer.xcodeproj \
            -scheme MurmurPlayer \
            -clonedSourcePackagesDirPath build/SourcePackages

      - name: Compilar (Release, iphoneos, sin firma)
        run: |
          set -o pipefail
          xcodebuild build \
            -project MurmurPlayer.xcodeproj \
            -scheme MurmurPlayer \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -clonedSourcePackagesDirPath build/SourcePackages \
            -derivedDataPath build/DerivedData \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | xcbeautify --renderer github-actions

      - name: Empaquetar .ipa
        run: |
          APP="build/DerivedData/Build/Products/Release-iphoneos/MurmurPlayer.app"
          test -d "$APP" || { echo "No se encontró $APP"; exit 1; }
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          zip -qry MurmurPlayer.ipa Payload
          ls -lh MurmurPlayer.ipa

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: MurmurPlayer-${{ github.run_number }}
          path: MurmurPlayer.ipa
          retention-days: 30
